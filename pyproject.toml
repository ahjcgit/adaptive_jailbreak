[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-jailbreak"
version = "0.1.0"
description = "Research framework for controlled iterative adversarial prompting experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
local = ["torch", "transformers", "accelerate", "bitsandbytes"]

[project.scripts]
adaptive-jailbreak = "adaptive_jailbreak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
