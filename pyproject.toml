[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-jailbreak"
version = "0.1.0"
description = "Two-model adaptive jailbreak experiment harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
adaptive-jailbreak = "adaptive_jailbreak.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
